# Builds and publishes the desktop installers.
#
# This is a CI job rather than a local script for one unavoidable reason: you cannot
# build a .dmg on Windows. electron-builder needs macOS to produce macOS targets, and
# this project is developed on Windows, so shipping both platforms means renting a Mac
# for ninety seconds from GitHub.
name: Desktop release

# Tags only, never a branch push. A release is a deliberate act with a version number
# attached and the tag IS that act. It also matters more than usual here because the
# artifact names carry no version - /download links at
# releases/latest/download/<asset>, so an accidental build on every merge would keep
# moving what those permanent links resolve to.
on:
  push:
    tags:
      - 'v*'

# Required to create the draft release and upload assets to it. The default token is
# read-only, and without this the job does the entire build and then dies at the
# upload with a 403.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the other. A draft holding only the
      # Windows installer is fixed by re-running a single job; a macOS job killed
      # partway through its upload leaves a mess that is harder to read.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # v5 rather than v4 on both of these: v4 runs on the Node 20 action runtime,
      # which GitHub removes from the runners in September 2026. v4 is not merely
      # noisy by then, it stops working.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # electron-builder does NOT use the tag that triggered this run. Its GitHub
      # publisher derives the release tag from package.json - "v" + version. So
      # pushing v0.2.0 while package.json still says 0.1.0 uploads into a draft for
      # v0.1.0, the build goes green, and the assets are quietly attached to the wrong
      # release. Fail here instead, before anything is built or uploaded.
      - name: Tag must match package.json
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($pkg). Bump the version, commit it, then re-tag."
            exit 1
          fi

      - run: npm ci

      # No `npm run build` first, on purpose. The Electron shell loads the production
      # origin at runtime and electron-builder packages no renderer assets, so
      # building the web app here would be dead work that slows every release.
      #
      # Both jobs run --publish always against the same draft release. That is safe
      # rather than a race: whichever job loses, electron-publish recognises GitHub's
      # 422 already_exists and re-fetches the release the other job created. The draft
      # is what stops the website ever linking to a half-populated release; the publish
      # job below is what turns it into a real one, once BOTH platforms have landed.
      #
      # Deliberately no CSC_* variables here. Both builds are unsigned for now - a
      # Windows certificate is around £200/yr and an Apple Developer account $99/yr -
      # and a fresh runner has no identity in its keychain, so electron-builder skips
      # macOS signing on its own. Forcing the point with CSC_IDENTITY_AUTO_DISCOVERY
      # is tempting but has been left alone: it is a lever over the macOS signing path
      # and nobody on this project owns a Mac to see what it does.
      - name: Build and publish
        run: npm run desktop:build -- --publish always
        env:
          # electron-builder's GitHub provider reads GH_TOKEN. Using the workflow's
          # built-in token also keeps releases off any personal gh credentials, which
          # is just as well - the local ones have been 401ing since they expired.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Turn the draft into a real release, exactly once, only if BOTH platforms built.
  #
  # This exists because the draft has to be published by something, and the obvious
  # something - a person running `gh release edit --draft=false` - is not available:
  # the local gh token expired on 2026-08-07, and an unpublished draft is invisible to
  # /releases/latest/download/..., which is precisely the URL the download page uses.
  # So every button on that page would 404 while the assets sat there, built and
  # unreachable.
  #
  # `needs: build` is the guard the draft was protecting: this job cannot start until
  # both matrix legs have succeeded, so a release never goes public with one platform
  # missing. fail-fast is off, so if macOS fails, Windows still uploads its assets to
  # the draft - and this job correctly does NOT run, leaving a draft to inspect rather
  # than a half-populated public release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Refuse to publish a release that is missing an update feed. Without latest.yml
      # the installers work but auto-update silently never fires, which is the kind of
      # broken that is only discovered months later when nobody has the new version.
      - name: Publish the release, if the feeds are there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "$assets"
          for required in Unote-Setup.exe latest.yml latest-mac.yml; do
            if ! grep -qx "$required" <<<"$assets"; then
              echo "::error::$required missing from $TAG - refusing to publish"
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "published $TAG"
